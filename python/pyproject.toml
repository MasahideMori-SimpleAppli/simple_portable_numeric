[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_portable_numeric"
version = "0.1.0"
description = "Arbitrary-precision decimal and rational arithmetic that gives identical results in Dart and Python."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Masahide Mori" }
]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/MasahideMori-SimpleAppli/simple_portable_numeric"

[tool.setuptools]
packages = ["simple_portable_numeric"]
